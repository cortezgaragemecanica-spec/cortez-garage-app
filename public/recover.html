<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Recuperando Cortez Garage</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#f4f4f4;font-family:Arial,sans-serif;text-align:center}main{width:min(88vw,420px)}img{width:120px}h1{font-size:1.35rem}p{color:#c8c8c8;line-height:1.5}.bar{height:5px;background:#292929;border-radius:99px;overflow:hidden}.bar::after{content:"";display:block;width:45%;height:100%;background:#f4c400;animation:move 1s infinite alternate}@keyframes move{to{transform:translateX(125%)}}
  </style>
</head>
<body>
  <main>
    <img src="./official-logo.png" alt="Cortez Garage">
    <h1>Recuperando o aplicativo…</h1>
    <p id="status">Removendo somente os arquivos temporários da versão anterior.</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
  <script>
    (async()=>{
      const status=document.querySelector('#status'),release='20261101-8';
      try{
        const tasks=[];
        if(window.caches?.keys)tasks.push(caches.keys().then(keys=>Promise.all(keys.filter(key=>key.startsWith('cortez-garage-')).map(key=>caches.delete(key)))));
        if(navigator.serviceWorker?.getRegistrations)tasks.push(navigator.serviceWorker.getRegistrations().then(items=>Promise.all(items.map(item=>item.unregister()))));
        await Promise.race([Promise.allSettled(tasks),new Promise(resolve=>setTimeout(resolve,4000))]);
        try{localStorage.setItem('cortez-web-release',release)}catch{}
        status.textContent='Recuperação concluída. Abrindo o Cortez Garage…';
      }catch(error){status.textContent='Abrindo o aplicativo sem o cache anterior…'}
      const target=new URL('./',location.href);target.searchParams.set('release',release);target.searchParams.set('recovered','1');location.replace(target.href);
    })();
  </script>
</body>
</html>
