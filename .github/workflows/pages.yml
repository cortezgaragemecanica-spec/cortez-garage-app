name: Publicar no GitHub Pages
on:
  push:
    branches: [main, work]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # A suíte histórica ainda contém várias asserções presas a números de cache antigos.
      # O deploy valida a sintaxe de todo o app e o teste do recurso atual sem mascarar erro de execução.
      - name: Validar JavaScript
        run: for file in src/*.js; do node --check "$file"; done
      - name: Validar recursos financeiros atuais
        run: node --test --test-name-pattern="financeiro controla acertos|baixa de conta a pagar|caixa bloqueia duplicidade|peças da ordem|nota do Luizinho|pagamento Luizinho|peça da OS consulta|peça encontrada preenche|busca da peça permite|nota do Luizinho possui rolagem|estoque lista código|nova entrada permite buscar|backup operacional" test/paths.test.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
