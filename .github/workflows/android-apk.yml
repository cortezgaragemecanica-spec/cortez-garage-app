name: Gerar APK Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gerar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Preparar arquivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Cortez-Garage-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cortez-Garage-Android
          path: Cortez-Garage-Android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.6
          name: Cortez Garage para Android v1.0.6
          body: Correção da tela branca com renovação segura do cache, além de notificações de novas O.S. e alterações de status.
          files: Cortez-Garage-Android.apk

